name: Build Android APK

# Only runs from Actions -> Run workflow. Never runs on push or pull_request.
"on":
  workflow_dispatch:
    inputs:
      tag:
        description: '新 Release 标签，例如 v0.9.0（不能已存在）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-debug-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7-stable
  GODOT_TEMPLATE_VERSION: 4.7.stable
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  android:
    name: Godot Android debug (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] ||
             ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo '::error::Tag must be a valid Git tag using letters, numbers, dots, underscores or hyphens, starting with a letter or number.'
            exit 1
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG"; then
            echo '::error::Tag already exists. Run the workflow with a new tag.'
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo '::error::Unable to check remote tags.'
              exit "$status"
            fi
          fi

      - name: Check project files
        run: |
          for file in project.godot export_presets.cfg; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Missing $file. Add the Godot project before building an APK."
              exit 1
            fi
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build tools
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install Godot and matching Android template
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/godot-download"
          template_dir="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          mkdir -p "$download_dir" "$template_dir" "$HOME/.local/bin"
          cd "$download_dir"
          base_url="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          engine="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}_export_templates.tpz"
          for file in "$engine" "$templates" SHA512-SUMS.txt; do
            curl --fail --location --retry 3 --output "$file" "$base_url/$file"
          done
          # Both downloaded archives must have a published, matching checksum.
          python3 - "$engine" "$templates" <<'PY'
          import pathlib, sys
          requested = set(sys.argv[1:])
          selected = {}
          for line in pathlib.Path('SHA512-SUMS.txt').read_text().splitlines():
              parts = line.split()
              if len(parts) == 2 and parts[1].lstrip('*') in requested:
                  selected[parts[1].lstrip('*')] = line
          if set(selected) != requested:
              raise SystemExit('Missing archive checksum in official release')
          pathlib.Path('selected-checksums.txt').write_text('\n'.join(selected.values()) + '\n')
          PY
          sha512sum --check selected-checksums.txt
          unzip -q "$engine"
          install -m 755 "Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/.local/bin/godot"
          unzip -q "$templates" 'templates/android_debug.apk' -d extracted
          install -m 644 extracted/templates/android_debug.apk "$template_dir/android_debug.apk"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure SDK paths and debug signing
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" build/android
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -noprompt \
            -keystore build/android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000
          godot --version

      - name: Import project resources
        run: |
          set -euo pipefail
          godot --headless --path . --editor --import 2>&1 | tee build/android/import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script' build/android/import.log; then
            echo '::error::Godot resource import reported script errors.'
            exit 1
          fi

      - name: Validate gameplay, career and full product flow
        run: python3 tools/validate.py --godot godot

      - name: Export and verify APK
        run: |
          set -euo pipefail
          godot --headless --path . --export-debug Android build/android/micro-apex-debug.apk \
            2>&1 | tee build/android/export.log
          test -s build/android/micro-apex-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/android/micro-apex-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging build/android/micro-apex-debug.apk \
            > build/android/apk-info.txt
          grep -F 'org.lseyesl.microapex' build/android/apk-info.txt
          grep -F 'arm64-v8a' build/android/apk-info.txt
          cd build/android
          sha256sum micro-apex-debug.apk > micro-apex-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: micro-apex-android-debug-${{ github.run_number }}
          path: |
            build/android/micro-apex-debug.apk
            build/android/micro-apex-debug.apk.sha256
            build/android/apk-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Micro Apex Android ARM64 调试版。

          下载 micro-apex-debug.apk 安装；附 SHA-256 校验文件和包信息。
          本包使用本次构建生成的临时调试签名，安装时可能需要卸载旧版；卸载会清除本地游戏记录。

          Commit: $RELEASE_SHA
          Build: $RUN_URL
          EOF
          gh release create "$RELEASE_TAG" \
            build/android/micro-apex-debug.apk \
            build/android/micro-apex-debug.apk.sha256 \
            build/android/apk-info.txt \
            --target "$RELEASE_SHA" \
            --title "Micro Apex Android debug $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false
          release_url="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          echo "APK Release: $release_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ github.run_number }}
          path: build/android/*.log
          if-no-files-found: ignore
          retention-days: 7
